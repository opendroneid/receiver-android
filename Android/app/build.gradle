plugins {
    id 'com.android.application'
}

// Release signing: credentials live in Android/signing.properties, keystore under Android/keystore/.
// Read at configuration time so `assembleRelease` produces a signed app-release.apk.
// If the file is absent the release build simply stays unsigned (debug builds are unaffected).
def signingPropsFile = rootProject.file("signing.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    def versionMajor = 3
    def versionMinor = 7
    def versionPatch = 0
    compileSdk = 37

    defaultConfig {
        applicationId = "org.opendroneid.android"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName = "${versionMajor}.${versionMinor}.${versionPatch}"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        def mapProperty = providers.gradleProperty("org.gradle.project.map")
        def useGoogleMaps = mapProperty.isPresent() && mapProperty.get() == "google_map"
        def baseMapProperty = providers.gradleProperty("org.gradle.project.basemap")
        def baseMap = baseMapProperty.isPresent() ? baseMapProperty.get() : "osm"
        buildConfigField "boolean", "USE_GOOGLE_MAPS", useGoogleMaps.toString()
        // Base map rendered by the osmdroid view: "osm" (default), "amap" (Gaode vector),
        // "amap_sat" (Gaode satellite + road/label overlay) or "google_sat" (Google imagery).
        // The "amap*" sources are GCJ-02, so Remote ID coordinates and the receiver
        // position are converted WGS-84 -> GCJ-02. The others stay in WGS-84.
        buildConfigField "String", "BASE_MAP", "\"" + baseMap + "\""
        buildConfigField "boolean", "NEEDS_GCJ02", ("amap".equals(baseMap) || "amap_sat".equals(baseMap)).toString()
    }

    signingConfigs {
        release {
            if (signingPropsFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix = ".debug"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
        }

        release {
            resValue "string", "app_version", "${defaultConfig.versionName}"
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig = true
        resValues = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-Xlint:deprecation"
    }

    namespace = 'org.opendroneid.android'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // UI
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference:1.2.1'

    // FastAdapter
    implementation 'com.mikepenz:fastadapter:5.7.0'
    implementation 'com.mikepenz:fastadapter-extensions-utils:5.7.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'

    // Maps & Location
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
